<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4: Dividir dos números</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Ejercicio 4: Dividir dos números</h1>
        <p>Evento submit del formulario con una función con nombre.</p>
    </header>

    <main>
        <form action="" id="formularioDividir">
            <label for="numero11">Número 1:</label>
            <input type="number" id="numero11" step="any" required>

            <label for="numero21">Número 2:</label>
            <input type="number" id="numero21" step="any" required>

            <div class="botones">
                <input type="submit" value="Aceptar">
                <input type="reset" value="Cancelar">
            </div>
        </form>
    </main>

    <script src="../js/ejercicio4.js"></script>
</body>
</html>
